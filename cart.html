<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart & Checkout | WorldBite Premium</title>
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEME
           ========================================================================== */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-main: #e11d48;
            --accent-hover: #be123c;
            --gold-premium: #d97706;
            --border-color: #e2e8f0;
            --nav-height: 80px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-glass: rgba(15, 23, 42, 0.85);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-main: #f43f5e;
            --border-color: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        button, input, select { outline: none; border: none; font-family: inherit; }
        .container { max-width: 1300px; margin: 0 auto; padding: 0 24px; }

        /* HEADER */
        header { position: fixed; top: 0; width: 100%; height: var(--nav-height); background: var(--bg-glass); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); z-index: 1000; }
        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; height: 100%; }
        .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo svg { width: 32px; height: 32px; fill: var(--accent-main); }
        .nav-links { display: flex; gap: 2.5rem; }
        .nav-links a { font-weight: 500; color: var(--text-secondary); }
        .nav-actions { display: flex; align-items: center; gap: 1.5rem; }
        .action-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: none; color: var(--text-primary); cursor: pointer; position: relative; }
        .action-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .lang-btn { font-weight: 600; padding: 0.5rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); }

        /* ==========================================================================
           2. LAYOUT: TWO COLUMNS (Cart Items + Checkout Form)
           ========================================================================== */
        .cart-wrapper { padding: calc(var(--nav-height) + 40px) 0 60px 0; display: grid; grid-template-columns: 1.5fr 1fr; gap: 3rem; align-items: start; }
        
        .section-title { font-size: 1.8rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .section-title span { color: var(--text-secondary); font-size: 1.2rem; font-weight: 500; }

        /* ITEMS LIST */
        .items-container { background: var(--bg-secondary); border-radius: 24px; padding: 2rem; border: 1px solid var(--border-color); }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0; border-bottom: 1px solid var(--border-color); }
        .cart-item:last-child { border-bottom: none; padding-bottom: 0; }
        
        .item-info { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
        .item-title { font-size: 1.2rem; font-weight: 700; }
        .item-price { color: var(--text-secondary); font-weight: 500; }
        .item-gift { color: #10b981; font-weight: 700; font-size: 0.9rem; border: 1px solid #10b981; padding: 2px 8px; border-radius: 4px; display: inline-block; width: max-content; }

        .item-controls { display: flex; align-items: center; gap: 1rem; }
        .qty-box { display: flex; align-items: center; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 50px; overflow: hidden; }
        .qty-btn { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; background: none; color: var(--text-primary); cursor: pointer; font-size: 1.2rem; transition: var(--transition-smooth); }
        .qty-btn:hover { background: var(--bg-secondary); }
        .qty-num { width: 30px; text-align: center; font-weight: 600; }
        
        .btn-remove { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(225, 29, 72, 0.1); color: var(--accent-main); cursor: pointer; transition: var(--transition-smooth); }
        .btn-remove:hover { background: var(--accent-main); color: #fff; }

        /* ==========================================================================
           3. CHECKOUT SUMMARY & FORM
           ========================================================================== */
        .checkout-container { background: var(--bg-secondary); border-radius: 24px; padding: 2.5rem; border: 1px solid var(--border-color); position: sticky; top: calc(var(--nav-height) + 20px); }
        
        /* Order Type Selection */
        .type-selector { display: flex; gap: 10px; margin-bottom: 2rem; background: var(--bg-primary); padding: 5px; border-radius: 12px; border: 1px solid var(--border-color); }
        .type-btn { flex: 1; padding: 0.8rem; text-align: center; border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--text-secondary); transition: var(--transition-smooth); }
        .type-btn.active { background: var(--text-primary); color: var(--bg-primary); }

        /* Dynamic Form Fields */
        .form-group { margin-bottom: 1.2rem; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-secondary); }
        .form-control { width: 100%; padding: 1rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-primary); font-size: 1rem; }
        .form-control:focus { border-color: var(--accent-main); }
        select.form-control { appearance: none; background-image: url('data:image/svg+xml;utf8,<svg fill="none" stroke="%23475569" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19 9l-7 7-7-7"></path></svg>'); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
        
        .branch-notice { background: rgba(217, 119, 6, 0.1); color: var(--gold-premium); padding: 1rem; border-radius: 10px; font-size: 0.9rem; margin-bottom: 1.5rem; display: none; border: 1px solid rgba(217, 119, 6, 0.2); }

        /* Summary Calculations */
        .summary-box { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px dashed var(--border-color); }
        .sum-row { display: flex; justify-content: space-between; margin-bottom: 0.8rem; color: var(--text-secondary); font-size: 1rem; }
        .sum-row.discount { color: #10b981; }
        .sum-total { display: flex; justify-content: space-between; margin-top: 1.5rem; padding-top: 1rem; border-top: 2px solid var(--border-color); font-size: 1.5rem; font-weight: 800; color: var(--text-primary); }

        .btn-checkout { width: 100%; padding: 1.2rem; margin-top: 2rem; background: var(--accent-main); color: #fff; font-size: 1.2rem; font-weight: 700; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: var(--transition-smooth); }
        .btn-checkout:hover { background: var(--accent-hover); box-shadow: 0 10px 20px rgba(225, 29, 72, 0.3); transform: translateY(-2px); }
        
        .btn-checkout:disabled { background: var(--text-secondary); cursor: not-allowed; transform: none; box-shadow: none; }

        /* Empty State */
        .empty-cart { text-align: center; padding: 4rem 0; grid-column: 1 / -1; }
        .empty-cart svg { width: 100px; height: 100px; color: var(--border-color); margin-bottom: 1.5rem; }
        .empty-cart h2 { font-size: 2rem; margin-bottom: 1rem; }
        .btn-back { display: inline-block; margin-top: 1.5rem; padding: 1rem 2.5rem; background: var(--text-primary); color: var(--bg-primary); border-radius: 50px; font-weight: 600; }

        /* Preloader & Toast */
        #preloader { position: fixed; inset: 0; background: var(--bg-primary); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .loader-ring { width: 50px; height: 50px; border: 3px solid var(--border-color); border-top-color: var(--accent-main); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
        .toast-msg { background: var(--bg-primary); border-left: 4px solid var(--accent-main); color: var(--text-primary); padding: 16px 24px; border-radius: 8px; box-shadow: var(--shadow-lg); transform: translateX(120%); transition: transform 0.4s; font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .toast-msg.show { transform: translateX(0); }
        .toast-msg.success { border-color: #10b981; }

        /* Loader Overlay for API Call */
        .api-loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; color: #fff; }
        .api-loader.active { display: flex; }

        @media (max-width: 900px) {
            .cart-wrapper { grid-template-columns: 1fr; }
            .checkout-container { position: static; }
        }
    </style>
</head>
<body>

    <div id="preloader"><div class="loader-ring"></div></div>
    
    <!-- Telegram Sending Loader -->
    <div class="api-loader" id="apiLoader">
        <div class="loader-ring" style="border-top-color: #10b981;"></div>
        <h3 style="margin-top: 20px;" data-lang="processing">Buyurtma rasmiylashtirilmoqda...</h3>
    </div>

    <!-- Header -->
    <header id="header">
        <div class="container nav-wrapper">
            <div class="logo" onclick="window.location.href='index.html'">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                <span data-lang="brand">WorldBite</span>
            </div>
            <nav class="nav-links" style="display: none;">
                <!-- Hidden on cart for focus, unless you want them -->
            </nav>
            <div class="nav-actions">
                <button class="action-btn" onclick="app.toggleTheme()">
                    <svg id="themeIcon" viewBox="0 0 24 24"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                </button>
                <select class="lang-btn" id="langSelect" onchange="app.changeLang(this.value)">
                    <option value="uz">O'Z</option>
                    <option value="ru">РУ</option>
                    <option value="en">EN</option>
                </select>
                <button class="action-btn" onclick="window.location.href='index.html'">
                    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="container cart-wrapper" id="mainWrapper">
        
        <!-- Left: Cart Items -->
        <div class="items-section">
            <h2 class="section-title"><span data-lang="title_cart">Shopping Cart</span> <span id="cartCountHeader">(0 items)</span></h2>
            <div class="items-container" id="cartItemsContainer">
                <!-- Items Rendered Here -->
            </div>
        </div>

        <!-- Right: Checkout Details -->
        <div class="checkout-container">
            <h2 class="section-title" data-lang="title_checkout">Order Details</h2>
            
            <!-- Type Selector -->
            <div class="type-selector">
                <button class="type-btn active" id="btnDel" onclick="app.setOrderType('delivery')" data-lang="tab_del">Delivery</button>
                <button class="type-btn" id="btnPick" onclick="app.setOrderType('pickup')" data-lang="tab_pick">Pickup</button>
                <button class="type-btn" id="btnDine" onclick="app.setOrderType('dinein')" data-lang="tab_dine">Dine-in</button>
            </div>

            <!-- Dynamic Form Container -->
            <form id="checkoutForm" onsubmit="app.submitOrder(event)">
                
                <div class="form-group">
                    <label class="form-label" data-lang="lbl_name">Full Name</label>
                    <input type="text" id="custName" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" data-lang="lbl_phone">Phone Number</label>
                    <input type="tel" id="custPhone" class="form-control" placeholder="+998" required>
                </div>

                <!-- Fields specific to Delivery -->
                <div id="deliveryFields">
                    <div class="form-group">
                        <label class="form-label" data-lang="lbl_address">Delivery Address</label>
                        <input type="text" id="custAddress" class="form-control" placeholder="Street, House/Apt">
                    </div>
                </div>

                <!-- Fields specific to Pickup / Dine-in -->
                <div id="branchFields" style="display: none;">
                    <div class="branch-notice" id="branchNotice">
                        <span data-lang="notice_pickup">You get a 10% discount for Pickup!</span>
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-lang="lbl_branch">Select Branch</label>
                        <select id="custBranch" class="form-control">
                            <option value="Tashkent City Center">Tashkent City Center</option>
                            <option value="Chilonzor Express">Chilonzor Express</option>
                            <option value="Yunusabad Family">Yunusabad Family</option>
                        </select>
                    </div>
                </div>

                <!-- Summary Section -->
                <div class="summary-box">
                    <div class="sum-row">
                        <span data-lang="sum_sub">Subtotal:</span>
                        <span id="sumSubtotal">0 UZS</span>
                    </div>
                    <div class="sum-row discount" id="rowPromo" style="display:none;">
                        <span id="promoLabel">Promo Code:</span>
                        <span id="sumPromo">-0 UZS</span>
                    </div>
                    <div class="sum-row discount" id="rowPickup" style="display:none;">
                        <span data-lang="sum_pick_disc">Pickup Discount (10%):</span>
                        <span id="sumPickup">-0 UZS</span>
                    </div>
                    <div class="sum-row" id="rowDelivery">
                        <span data-lang="sum_del_fee">Delivery Fee:</span>
                        <span id="sumDel">15,000 UZS</span>
                    </div>
                    
                    <div class="sum-total">
                        <span data-lang="sum_total">Total:</span>
                        <span id="sumTotal">0 UZS</span>
                    </div>
                </div>

                <button type="submit" class="btn-checkout" id="btnSubmit">
                    <span data-lang="btn_confirm">Confirm Order</span>
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                </button>
            </form>
        </div>
    </main>

    <div id="toast-container"></div>

    <script>
        // TRANSLATIONS
        const dict = {
            uz: {
                brand: "WorldBite", title_cart: "Savat", title_checkout: "Buyurtma berish",
                tab_del: "Yetkazish", tab_pick: "Olib ketish", tab_dine: "Restoranda",
                lbl_name: "To'liq Ism", lbl_phone: "Telefon raqam", lbl_address: "Manzil (Ko'cha, Uy)", lbl_branch: "Filialni tanlang",
                notice_pickup: "Olib ketish xizmati uchun 10% chegirma beriladi!",
                sum_sub: "Oraliq summa:", sum_pick_disc: "Olib ketish chegirmasi (10%):", sum_del_fee: "Yetkazish xizmati:", sum_total: "Yakuniy summa:",
                btn_confirm: "Buyurtmani Tasdiqlash", btn_back: "Menyuga qaytish", empty_title: "Savatingiz bo'sh", empty_desc: "Menyudan mazali taomlarni tanlang.",
                gift_label: "SOVG'A", toast_success: "Buyurtma muvaffaqiyatli qabul qilindi!", toast_error: "Tarmoq xatosi. Qayta urinib ko'ring.",
                processing: "Buyurtma botga yuborilmoqda..."
            },
            ru: {
                brand: "WorldBite", title_cart: "Корзина", title_checkout: "Оформление заказа",
                tab_del: "Доставка", tab_pick: "Самовывоз", tab_dine: "В ресторане",
                lbl_name: "Полное имя", lbl_phone: "Номер телефона", lbl_address: "Адрес (Улица, Дом)", lbl_branch: "Выберите филиал",
                notice_pickup: "Скидка 10% при самовывозе!",
                sum_sub: "Подытог:", sum_pick_disc: "Скидка за самовывоз (10%):", sum_del_fee: "Доставка:", sum_total: "Итого:",
                btn_confirm: "Подтвердить заказ", btn_back: "Вернуться в меню", empty_title: "Ваша корзина пуста", empty_desc: "Выберите вкусные блюда из меню.",
                gift_label: "ПОДАРОК", toast_success: "Заказ успешно принят!", toast_error: "Ошибка сети. Попробуйте еще раз.",
                processing: "Отправка заказа в бот..."
            },
            en: {
                brand: "WorldBite", title_cart: "Shopping Cart", title_checkout: "Order Details",
                tab_del: "Delivery", tab_pick: "Pickup", tab_dine: "Dine-In",
                lbl_name: "Full Name", lbl_phone: "Phone Number", lbl_address: "Delivery Address", lbl_branch: "Select Branch",
                notice_pickup: "You get a 10% discount for Pickup!",
                sum_sub: "Subtotal:", sum_pick_disc: "Pickup Discount (10%):", sum_del_fee: "Delivery Fee:", sum_total: "Total:",
                btn_confirm: "Confirm Order", btn_back: "Back to Menu", empty_title: "Your cart is empty", empty_desc: "Add some delicious meals from our menu.",
                gift_label: "FREE GIFT", toast_success: "Order confirmed successfully!", toast_error: "Network error. Please try again.",
                processing: "Sending order to bot..."
            }
        };

        class CartApp {
            constructor() {
                this.lang = localStorage.getItem('wb_lang') || 'en';
                this.theme = localStorage.getItem('wb_theme') || 'light';
                this.cart = JSON.parse(localStorage.getItem('wb_cart')) || [];
                this.promos = JSON.parse(localStorage.getItem('wb_promos')) || [];
                this.selectedBranch = localStorage.getItem('wb_selected_branch') || 'Tashkent City Center';
                
                this.orderType = 'delivery'; // default
                this.deliveryFee = 15000;
                
                // TELEGRAM BOT CREDENTIALS
                this.BOT_TOKEN = "8214364068:AAEt35tMZMnSb2HzW5xQyl0KHy9W1_Utbbk";
                this.CHAT_ID = "7876053445";

                this.init();
            }

            init() {
                this.applyTheme(this.theme);
                this.changeLang(this.lang);
                
                // Set branch dropdown if selected previously
                const branchSelect = document.getElementById('custBranch');
                // Check if ID was stored instead of name (from previous script logic mapping)
                // Just force the value if it matches our options
                Array.from(branchSelect.options).forEach(opt => {
                    if(opt.value === this.selectedBranch || opt.value.toLowerCase().includes(this.selectedBranch.replace('b_',''))) {
                        branchSelect.value = opt.value;
                    }
                });

                this.renderCart();

                setTimeout(() => {
                    const preloader = document.getElementById('preloader');
                    preloader.style.opacity = '0';
                    setTimeout(() => preloader.style.display = 'none', 300);
                }, 400);
            }

            applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                const iconPath = theme === 'dark' 
                    ? '<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>'
                    : '<path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>';
                document.getElementById('themeIcon').innerHTML = iconPath;
            }

            toggleTheme() {
                this.theme = this.theme === 'light' ? 'dark' : 'light';
                this.applyTheme(this.theme);
                localStorage.setItem('wb_theme', this.theme);
            }

            changeLang(langCode) {
                this.lang = langCode;
                localStorage.setItem('wb_lang', langCode);
                document.getElementById('langSelect').value = this.lang;
                
                document.querySelectorAll('[data-lang]').forEach(el => {
                    const key = el.getAttribute('data-lang');
                    if (dict[this.lang][key]) el.innerHTML = dict[this.lang][key];
                });
                
                this.renderCart();
            }

            /* --- Form Switching Logic --- */
            setOrderType(type) {
                this.orderType = type;
                
                // Toggle Buttons
                ['btnDel', 'btnPick', 'btnDine'].forEach(id => document.getElementById(id).classList.remove('active'));
                
                if(type === 'delivery') {
                    document.getElementById('btnDel').classList.add('active');
                    document.getElementById('deliveryFields').style.display = 'block';
                    document.getElementById('branchFields').style.display = 'none';
                    document.getElementById('custAddress').setAttribute('required', 'true');
                } else if(type === 'pickup') {
                    document.getElementById('btnPick').classList.add('active');
                    document.getElementById('deliveryFields').style.display = 'none';
                    document.getElementById('branchFields').style.display = 'block';
                    document.getElementById('branchNotice').style.display = 'block';
                    document.getElementById('custAddress').removeAttribute('required');
                } else if(type === 'dinein') {
                    document.getElementById('btnDine').classList.add('active');
                    document.getElementById('deliveryFields').style.display = 'none';
                    document.getElementById('branchFields').style.display = 'block';
                    document.getElementById('branchNotice').style.display = 'none'; // No discount for dine in
                    document.getElementById('custAddress').removeAttribute('required');
                }
                
                this.calculateTotal();
            }

            /* --- Cart Manipulation --- */
            updateQty(id, delta) {
                const item = this.cart.find(i => i.id === id);
                if (item) {
                    item.qty += delta;
                    if (item.qty <= 0) {
                        this.cart = this.cart.filter(i => i.id !== id);
                    }
                    localStorage.setItem('wb_cart', JSON.stringify(this.cart));
                    this.renderCart();
                }
            }

            removeItem(id) {
                this.cart = this.cart.filter(i => i.id !== id);
                localStorage.setItem('wb_cart', JSON.stringify(this.cart));
                this.renderCart();
            }

            renderCart() {
                const container = document.getElementById('cartItemsContainer');
                const countHeader = document.getElementById('cartCountHeader');
                const mainWrap = document.getElementById('mainWrapper');
                const btnSubmit = document.getElementById('btnSubmit');
                
                const totalItems = this.cart.reduce((sum, i) => sum + i.qty, 0);
                countHeader.innerText = `(${totalItems})`;

                if (this.cart.length === 0) {
                    mainWrap.innerHTML = `
                        <div class="empty-cart">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                            <h2>${dict[this.lang].empty_title}</h2>
                            <p>${dict[this.lang].empty_desc}</p>
                            <a href="menu.html" class="btn-back">${dict[this.lang].btn_back}</a>
                        </div>
                    `;
                    mainWrap.style.gridTemplateColumns = '1fr';
                    return;
                }

                container.innerHTML = '';
                this.cart.forEach(item => {
                    const isGift = item.type === 'gift' || item.price === 0;
                    
                    // Display name logic (Fallback to ID if name not saved properly)
                    let displayName = item.name || item.id;
                    if(!item.name && item.id.includes('u1')) displayName = "Palov"; // Basic fallback for pure IDs

                    const priceHtml = isGift 
                        ? `<span class="item-gift">${dict[this.lang].gift_label}</span>`
                        : `<div class="item-price">${(item.price * item.qty).toLocaleString()} UZS</div>`;

                    const controlsHtml = isGift 
                        ? `<div class="btn-remove" onclick="app.removeItem('${item.id}')"><svg width="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></div>`
                        : `
                        <div class="qty-box">
                            <button type="button" class="qty-btn" onclick="app.updateQty('${item.id}', -1)">-</button>
                            <div class="qty-num">${item.qty}</div>
                            <button type="button" class="qty-btn" onclick="app.updateQty('${item.id}', 1)">+</button>
                        </div>
                        <div class="btn-remove" onclick="app.removeItem('${item.id}')">
                            <svg width="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </div>
                        `;

                    const html = `
                        <div class="cart-item">
                            <div class="item-info">
                                <div class="item-title">${displayName}</div>
                                ${priceHtml}
                            </div>
                            <div class="item-controls">
                                ${controlsHtml}
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });

                this.calculateTotal();
            }

            calculateTotal() {
                let subtotal = this.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                document.getElementById('sumSubtotal').innerText = `${subtotal.toLocaleString()} UZS`;

                let finalTotal = subtotal;
                
                // 1. Promo Code Discount
                const rowPromo = document.getElementById('rowPromo');
                let promoDiscountVal = 0;
                let activePromoText = "";
                
                if (this.promos.includes('WORLD50')) {
                    promoDiscountVal = subtotal * 0.5; // 50% off
                    activePromoText = "WORLD50 (50%)";
                }

                if (promoDiscountVal > 0) {
                    rowPromo.style.display = 'flex';
                    document.getElementById('promoLabel').innerText = `Promo: ${activePromoText}`;
                    document.getElementById('sumPromo').innerText = `-${promoDiscountVal.toLocaleString()} UZS`;
                    finalTotal -= promoDiscountVal;
                } else {
                    rowPromo.style.display = 'none';
                }

                // 2. Pickup Discount (Only if orderType is pickup)
                const rowPickup = document.getElementById('rowPickup');
                let pickupDiscountVal = 0;
                
                if (this.orderType === 'pickup' && finalTotal > 0) {
                    pickupDiscountVal = finalTotal * 0.1; // 10% off
                    rowPickup.style.display = 'flex';
                    document.getElementById('sumPickup').innerText = `-${pickupDiscountVal.toLocaleString()} UZS`;
                    finalTotal -= pickupDiscountVal;
                } else {
                    rowPickup.style.display = 'none';
                }

                // 3. Delivery Fee
                const rowDelivery = document.getElementById('rowDelivery');
                if (this.orderType === 'delivery') {
                    rowDelivery.style.display = 'flex';
                    document.getElementById('sumDel').innerText = `${this.deliveryFee.toLocaleString()} UZS`;
                    finalTotal += this.deliveryFee;
                } else {
                    rowDelivery.style.display = 'none';
                }

                // Protect against negative totals
                if (finalTotal < 0) finalTotal = 0;

                document.getElementById('sumTotal').innerText = `${finalTotal.toLocaleString()} UZS`;
                this.finalTotalAmount = finalTotal; // save for bot
            }

            /* --- TELEGRAM BOT INTEGRATION --- */
            async submitOrder(e) {
                e.preventDefault();
                
                if (this.cart.length === 0) return;

                // Show Loader
                document.getElementById('apiLoader').classList.add('active');

                // 1. Gather Customer Data
                const name = document.getElementById('custName').value;
                const phone = document.getElementById('custPhone').value;
                
                let addressOrBranch = "";
                if(this.orderType === 'delivery') addressOrBranch = "Manzil: " + document.getElementById('custAddress').value;
                else if(this.orderType === 'pickup') addressOrBranch = "Olib ketish: " + document.getElementById('custBranch').value;
                else addressOrBranch = "Restoranda: " + document.getElementById('custBranch').value;

                // 2. Format Items List for Telegram
                let itemsText = "";
                this.cart.forEach((item, index) => {
                    let itemName = item.name || item.id;
                    let linePrice = item.type === 'gift' ? 'SOVGA' : `${(item.price * item.qty).toLocaleString()} UZS`;
                    itemsText += `${index + 1}. ${itemName} | ${item.qty} ta | ${linePrice}\n`;
                });

                // 3. Check Promos
                let promosApplied = this.promos.length > 0 ? this.promos.join(', ') : 'Yoq';

                // 4. Create Final Text string using Markdown format
                const textMessage = `
🔴 <b>YANGI BUYURTMA! (WorldBite Premium)</b>

👤 <b>Mijoz:</b> ${name}
📞 <b>Tel:</b> ${phone}
📍 <b>${addressOrBranch}</b>
🚀 <b>Xizmat turi:</b> ${this.orderType.toUpperCase()}
🎟 <b>Promo kodlar:</b> ${promosApplied}

🛒 <b>Buyurtma tarkibi:</b>
-------------------------
${itemsText}-------------------------
💰 <b>YAKUNIY SUMMA: ${this.finalTotalAmount.toLocaleString()} UZS</b>
                `;

                // 5. Send to Telegram using Fetch API
                const url = `https://api.telegram.org/bot${this.BOT_TOKEN}/sendMessage`;
                
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: this.CHAT_ID,
                            text: textMessage,
                            parse_mode: 'HTML'
                        })
                    });

                    const data = await response.json();
                    
                    document.getElementById('apiLoader').classList.remove('active');

                    if(data.ok) {
                        this.showToast(dict[this.lang].toast_success, 'success');
                        
                        // Clear Cart after successful order
                        localStorage.removeItem('wb_cart');
                        localStorage.removeItem('wb_promos'); // reset promos too
                        
                        // Redirect to home after 2 seconds
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 2500);
                        
                    } else {
                        throw new Error(data.description);
                    }

                } catch (error) {
                    console.error("Telegram API Error:", error);
                    document.getElementById('apiLoader').classList.remove('active');
                    this.showToast(dict[this.lang].toast_error, 'error');
                }
            }

            showToast(message, type = 'default') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `toast-msg ${type}`;
                
                let icon = '';
                if(type === 'success') icon = '<svg width="24" height="24" fill="none" stroke="#10b981" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
                else icon = '<svg width="24" height="24" fill="none" stroke="#e11d48" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>';

                toast.innerHTML = `${icon} <span>${message}</span>`;
                container.appendChild(toast);

                void toast.offsetWidth; 
                toast.classList.add('show');

                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }
        }

        const app = new CartApp();

    </script>
</body>
</html>
