<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | WorldBite Premium</title>
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEME CONFIGURATION (Global)
           ========================================================================== */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-main: #e11d48; 
            --accent-hover: #be123c;
            --gold-premium: #d97706;
            --border-color: #e2e8f0;
            --nav-height: 80px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-glass: rgba(15, 23, 42, 0.85);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-main: #f43f5e;
            --accent-hover: #e11d48;
            --gold-premium: #fbbf24;
            --border-color: #1e293b;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); line-height: 1.6; transition: var(--transition-smooth); overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button, input, select { outline: none; border: none; font-family: inherit; background: none; }
        img { max-width: 100%; display: block; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

        /* ==========================================================================
           2. HEADER (Reused structure for seamless experience)
           ========================================================================== */
        header { position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-height); background: var(--bg-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); z-index: 1000; transition: var(--transition-smooth); }
        header.scrolled { box-shadow: var(--shadow-md); }
        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; height: 100%; }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-primary); }
        .logo svg { width: 32px; height: 32px; fill: var(--accent-main); }
        .nav-links { display: flex; gap: 2.5rem; }
        .nav-links a { font-weight: 500; color: var(--text-secondary); position: relative; transition: var(--transition-smooth); padding: 0.5rem 0; }
        .nav-links a:hover, .nav-links a.active { color: var(--text-primary); }
        .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--accent-main); transition: var(--transition-smooth); }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
        
        .nav-actions { display: flex; align-items: center; gap: 1.5rem; }
        .action-btn { color: var(--text-primary); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; transition: var(--transition-smooth); position: relative; cursor: pointer; }
        .action-btn:hover { background: var(--bg-secondary); }
        .action-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .badge-count { position: absolute; top: 2px; right: 2px; background: var(--accent-main); color: #fff; font-size: 0.65rem; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg-primary); }
        .lang-btn { font-weight: 600; font-size: 0.9rem; padding: 0.5rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); cursor: pointer; }
        .mobile-menu-btn { display: none; }

        /* ==========================================================================
           3. MENU HERO SECTION
           ========================================================================== */
        .menu-hero { padding-top: calc(var(--nav-height) + 40px); padding-bottom: 40px; background: var(--bg-secondary); text-align: center; position: relative; overflow: hidden; }
        .menu-hero::before { content: ''; position: absolute; top: -50%; left: 50%; transform: translateX(-50%); width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(225, 29, 72, 0.05) 0%, transparent 70%); pointer-events: none; }
        .menu-hero h1 { font-size: clamp(2.5rem, 4vw, 3.5rem); margin-bottom: 1rem; color: var(--text-primary); }
        .menu-hero h1 span { color: var(--accent-main); }
        .menu-hero p { font-size: 1.1rem; color: var(--text-secondary); max-width: 600px; margin: 0 auto; }

        /* ==========================================================================
           4. FILTERS & CONTROLS (Advanced UI)
           ========================================================================== */
        .controls-section { padding: 2rem 0; background: var(--bg-primary); position: sticky; top: var(--nav-height); z-index: 90; border-bottom: 1px solid var(--border-color); }
        .controls-wrapper { display: flex; flex-direction: column; gap: 1.5rem; }
        
        /* Search & Sort */
        .search-sort-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
        
        .search-box { position: relative; flex: 1; max-width: 500px; }
        .search-box svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--text-secondary); }
        .search-box input { width: 100%; padding: 1rem 1rem 1rem 3rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 50px; color: var(--text-primary); font-size: 1rem; transition: var(--transition-smooth); }
        .search-box input:focus { border-color: var(--accent-main); box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.1); }
        
        .sort-box select { padding: 1rem 2rem 1rem 1.5rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 50px; color: var(--text-primary); font-size: 1rem; font-weight: 500; cursor: pointer; appearance: none; transition: var(--transition-smooth); background-image: url('data:image/svg+xml;utf8,<svg fill="none" stroke="%23475569" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>'); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
        [data-theme="dark"] .sort-box select { background-image: url('data:image/svg+xml;utf8,<svg fill="none" stroke="%2394a3b8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>'); }
        .sort-box select:focus { border-color: var(--accent-main); }

        /* Category Pills */
        .categories-scroll { display: flex; gap: 1rem; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 50px; color: var(--text-secondary); font-weight: 600; cursor: pointer; white-space: nowrap; transition: var(--transition-smooth); }
        .cat-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .cat-btn:hover { border-color: var(--accent-main); color: var(--accent-main); }
        .cat-btn.active { background: var(--accent-main); border-color: var(--accent-main); color: #fff; box-shadow: 0 4px 10px rgba(225, 29, 72, 0.3); }

        /* ==========================================================================
           5. MENU GRID (Products)
           ========================================================================== */
        .menu-main { padding: 4rem 0 8rem 0; background: var(--bg-primary); min-height: 60vh; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2.5rem; }
        
        .food-card { background: var(--bg-secondary); border-radius: 24px; overflow: hidden; border: 1px solid var(--border-color); transition: var(--transition-smooth); opacity: 0; transform: translateY(20px); animation: fadeInCard 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes fadeInCard { to { opacity: 1; transform: translateY(0); } }
        
        .food-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-5px); }
        
        .food-img-wrap { position: relative; height: 220px; overflow: hidden; background: #e2e8f0; }
        .food-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .food-card:hover .food-img-wrap img { transform: scale(1.08); }
        
        .food-badge { position: absolute; top: 1rem; left: 1rem; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.8rem; font-weight: 700; color: #fff; }
        .food-badge.premium { background: linear-gradient(135deg, #d97706, #fbbf24); color: #000; }

        .food-fav { position: absolute; top: 1rem; right: 1rem; width: 40px; height: 40px; background: var(--bg-glass); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition-smooth); color: var(--text-secondary); box-shadow: var(--shadow-sm); }
        .food-fav:hover { color: var(--accent-main); transform: scale(1.1); }
        .food-fav.active { color: var(--accent-main); }
        .food-fav.active svg { fill: var(--accent-main); }

        .food-info { padding: 1.5rem; }
        .food-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
        .food-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }
        .food-rating { display: flex; align-items: center; gap: 4px; color: var(--gold-premium); font-size: 0.85rem; font-weight: 700; background: var(--bg-primary); padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border-color); }
        
        .food-desc { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .food-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px dashed var(--border-color); }
        .food-price { font-size: 1.4rem; font-weight: 800; color: var(--accent-main); }
        
        .btn-add { display: flex; align-items: center; gap: 8px; padding: 0.75rem 1.25rem; border-radius: 12px; background: var(--text-primary); color: var(--bg-primary); font-weight: 600; cursor: pointer; transition: var(--transition-smooth); }
        .btn-add:hover { background: var(--accent-main); color: #fff; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4); }
        .btn-add svg { width: 18px; height: 18px; stroke-width: 2.5; }

        /* Empty State */
        .empty-state { text-align: center; padding: 4rem 0; width: 100%; grid-column: 1 / -1; }
        .empty-state svg { width: 80px; height: 80px; color: var(--border-color); margin-bottom: 1.5rem; }
        .empty-state h3 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .empty-state p { color: var(--text-secondary); }

        /* ==========================================================================
           6. TOAST NOTIFICATIONS & FOOTER
           ========================================================================== */
        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast-msg { background: var(--bg-primary); border-left: 4px solid var(--accent-main); color: var(--text-primary); padding: 16px 24px; border-radius: 8px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 12px; font-weight: 500; transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .toast-msg.show { transform: translateX(0); }
        .toast-msg.success { border-color: #10b981; }

        footer { background: #0f172a; color: #f8fafc; padding: 4rem 0 2rem 0; margin-top: auto; }
        .footer-bottom { border-top: 1px solid #1e293b; padding-top: 2rem; display: flex; justify-content: space-between; color: #64748b; font-size: 0.9rem; }

        /* Preloader */
        #preloader { position: fixed; inset: 0; background: var(--bg-primary); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .loader-ring { width: 50px; height: 50px; border: 3px solid var(--border-color); border-top-color: var(--accent-main); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: block; }
            .search-sort-bar { flex-direction: column; align-items: stretch; }
            .search-box { max-width: 100%; }
        }
    </style>
</head>

            { id: 'd1', cat: 'drinks', img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=500', price: 45000, rating: 4.5, isPremium: false, tag: 'Cold',

            // Dessert
            { id: 'ds1', cat: 'dessert', img: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500', price: 80000, rating: 4.9, isPremium: true, tag: 'Sweet',
              en: { title: 'Dark Chocolate Lava', desc: 'Warm chocolate cake with a gooey molten center, served with vanilla ice cream.' },
              uz: { title: 'Qora Shokoladli Lava', desc: 'O\'rtasi suyuq qaynoq shokoladli tort, vanilli muzqaymoq bilan birga tortiladi.' },
              ru: { title: 'Шоколадная Лава', desc: 'Теплый шоколадный кекс с жидким центром, подается с ванильным мороженым.' } }
        ];

        // --- 2. Dictionaries for Localization ---
        const dict = {
            uz: {
                brand: "WorldBite", nav_home: "Bosh sahifa", nav_menu: "Menyu", nav_services: "Xizmatlar", nav_locations: "Manzillar",
                mh_title: "Jahon <span>Ta'mlarini</span> Kashf Eting", mh_desc: "Oshxonalar bo'yicha filtrlang, o'zingiz yoqtirgan taomlarni qidiring va premium menyudan bahramand bo'ling.",
                search_ph: "Taom yoki masalliq izlash...", sort_def: "Tavsiya etilgan", sort_pa: "Narx: Arzondan Qimmatga", sort_pd: "Narx: Qimmatdan Arzonga", sort_rat: "Eng ko'p baholangan",
                cat_all: "Barchasi", cat_it: "Italiya", cat_jp: "Yaponiya", cat_uz: "O'zbek", cat_mx: "Meksika", cat_dr: "Ichimliklar", cat_ds: "Shirinliklar",
                btn_add: "Savatga", empty_title: "Hech narsa topilmadi", empty_desc: "Boshqa so'z bilan qidirib ko'ring yoki filtrlarni tozalang.",
                foot_developed: "Senior Dasturchilar Jamoasi Tomonidan Yaratildi", toast_add: "savatga qo'shildi",
                premium: "Premium"
            },
            ru: {
                brand: "WorldBite", nav_home: "Главная", nav_menu: "Меню", nav_services: "Услуги", nav_locations: "Локации",
                mh_title: "Откройте <span>Мировые</span> Вкусы", mh_desc: "Фильтруйте по кухне, ищите любимые блюда и наслаждайтесь нашим премиальным меню.",
                search_ph: "Поиск блюд или ингредиентов...", sort_def: "Рекомендуемые", sort_pa: "Цена: По возрастанию", sort_pd: "Цена: По убыванию", sort_rat: "С высоким рейтингом",
                cat_all: "Все", cat_it: "Итальянская", cat_jp: "Японская", cat_uz: "Узбекская", cat_mx: "Мексиканская", cat_dr: "Напитки", cat_ds: "Десерты",
                btn_add: "В корзину", empty_title: "Ничего не найдено", empty_desc: "Попробуйте изменить поисковый запрос или сбросить фильтры.",
                foot_developed: "Разработано командой Senior разработчиков", toast_add: "добавлено в корзину",
                premium: "Премиум"
            },
            en: {
                brand: "WorldBite", nav_home: "Home", nav_menu: "Menu", nav_services: "Services", nav_locations: "Locations",
                mh_title: "Explore <span>Global</span> Flavors", mh_desc: "Filter by cuisine, search for your favorites, and enjoy our premium selection.",
                search_ph: "Search dishes or ingredients...", sort_def: "Recommended", sort_pa: "Price: Low to High", sort_pd: "Price: High to Low", sort_rat: "Top Rated",
                cat_all: "All", cat_it: "Italian", cat_jp: "Japanese", cat_uz: "Uzbek", cat_mx: "Mexican", cat_dr: "Drinks", cat_ds: "Desserts",
                btn_add: "Add", empty_title: "No results found", empty_desc: "Try adjusting your search or clearing the filters.",
                foot_developed: "Engineered by Senior Dev Team", toast_add: "added to cart",
                premium: "Premium"
            }
        };

        // --- 3. Menu Application Class (OOP) ---
        class MenuApp {
            constructor() {
                this.lang = localStorage.getItem('wb_lang') || 'en';
                this.theme = localStorage.getItem('wb_theme') || 'light';
                this.cart = JSON.parse(localStorage.getItem('wb_cart')) || [];
                this.favs = JSON.parse(localStorage.getItem('wb_favs')) || [];
                
                this.currentCategory = 'all';
                this.searchQuery = '';
                this.currentSort = 'default';
                
                this.init();
            }

            init() {
                this.applyTheme(this.theme);
                this.changeLang(this.lang);
                document.getElementById('langSelect').value = this.lang;
                
                this.updateBadges();
                this.renderGrid();
                this.handleHeaderScroll();

                window.addEventListener('load', () => {
                    setTimeout(() => {
                        const preloader = document.getElementById('preloader');
                        preloader.style.opacity = '0';
                        setTimeout(() => preloader.style.display = 'none', 300);
                    }, 400);
                });
            }

            /* --- UI & Logic --- */
            toggleTheme() {
                this.theme = this.theme === 'light' ? 'dark' : 'light';
                this.applyTheme(this.theme);
                localStorage.setItem('wb_theme', this.theme);
            }

            applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                const iconPath = theme === 'dark' 
                    ? '<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>'
                    : '<path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>';
                document.getElementById('themeIcon').innerHTML = iconPath;
            }

            changeLang(langCode) {
                this.lang = langCode;
                localStorage.setItem('wb_lang', langCode);
                
                // Text Translation
                document.querySelectorAll('[data-lang]').forEach(el => {
                    const key = el.getAttribute('data-lang');
                    if (dict[this.lang][key]) el.innerHTML = dict[this.lang][key];
                });
                
                // Placeholder Translation
                const searchInp = document.getElementById('searchInput');
                searchInp.placeholder = dict[this.lang][searchInp.getAttribute('data-lang-placeholder')];
                
                this.renderGrid();
            }

            updateBadges() {
                document.getElementById('cartBadge').innerText = this.cart.reduce((sum, item) => sum + item.qty, 0);
                document.getElementById('favBadge').innerText = this.favs.length;
            }

            handleHeaderScroll() {
                const header = document.getElementById('header');
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 20) header.classList.add('scrolled');
                    else header.classList.remove('scrolled');
                });
            }

            /* --- Filters, Search, Sort --- */
            filterCategory(cat, btnElement) {
                this.currentCategory = cat;
                document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
                
                // Center the clicked button in the scroll container
                btnElement.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                this.renderGrid();
            }

            handleSearch(query) {
                this.searchQuery = query.toLowerCase().trim();
                this.renderGrid();
            }

            handleSort(sortType) {
                this.currentSort = sortType;
                this.renderGrid();
            }

            getFilteredAndSortedData() {
                // 1. Filter by Category
                let result = productsDB.filter(p => this.currentCategory === 'all' || p.cat === this.currentCategory);
                
                // 2. Filter by Search Query
                if (this.searchQuery) {
                    result = result.filter(p => {
                        const title = p[this.lang].title.toLowerCase();
                        const desc = p[this.lang].desc.toLowerCase();
                        return title.includes(this.searchQuery) || desc.includes(this.searchQuery);
                    });
                }

                // 3. Sort
                if (this.currentSort === 'priceAsc') result.sort((a, b) => a.price - b.price);
                else if (this.currentSort === 'priceDesc') result.sort((a, b) => b.price - a.price);
                else if (this.currentSort === 'rating') result.sort((a, b) => b.rating - a.rating);

                return result;
            }

            /* --- Render Grid --- */
            renderGrid() {
                const grid = document.getElementById('menuGrid');
                grid.innerHTML = '';
                const data = this.getFilteredAndSortedData();

                if (data.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10V3L4 14h7v7l9-11h-7z" style="opacity:0.2"/><path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <h3>${dict[this.lang].empty_title}</h3>
                            <p>${dict[this.lang].empty_desc}</p>
                        </div>
                    `;
                    grid.style.display = 'block'; // Remove grid styling for empty state
                    return;
                }

                grid.style.display = 'grid'; // Restore grid
                
                data.forEach((prod, index) => {
                    const tData = prod[this.lang];
                    const isFav = this.favs.includes(prod.id);
                    const favIconPath = isFav 
                        ? '<path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>'
                        : '<path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>';
                    
                    const badgeHtml = prod.isPremium 
                        ? `<div class="food-badge premium">👑 ${dict[this.lang].premium}</div>` 
                        : `<div class="food-badge">${prod.tag}</div>`;

                    const html = `
                        <div class="food-card" style="animation-delay: ${index * 0.05}s">
                            <div class="food-img-wrap">
                                ${badgeHtml}
                                <button class="food-fav ${isFav ? 'active' : ''}" onclick="menuApp.toggleFav('${prod.id}')">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${favIconPath}</svg>
                                </button>
                                <img src="${prod.img}" loading="lazy" alt="${tData.title}">
                            </div>
                            <div class="food-info">
                                <div class="food-header">
                                    <h3 class="food-title">${tData.title}</h3>
                                    <div class="food-rating">★ ${prod.rating}</div>
                                </div>
                                <p class="food-desc">${tData.desc}</p>
                                <div class="food-footer">
                                    <div class="food-price">${prod.price.toLocaleString()} UZS</div>
                                    <button class="btn-add" onclick="menuApp.addToCart('${prod.id}', '${tData.title.replace(/'/g, "\\'")}')">
                                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                                        ${dict[this.lang].btn_add}
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += html;
                });
            }

            /* --- Actions --- */
            toggleFav(id) {
                const index = this.favs.indexOf(id);
                if (index > -1) this.favs.splice(index, 1);
                else this.favs.push(id);
                
                localStorage.setItem('wb_favs', JSON.stringify(this.favs));
                this.updateBadges();
                this.renderGrid(); // Re-render to update UI
            }

            addToCart(id, title) {
                const item = this.cart.find(i => i.id === id);
                if (item) {
                    item.qty++;
                } else {
                    const prod = productsDB.find(p => p.id === id);
                    this.cart.push({ id, price: prod.price, qty: 1 });
                }
                
                localStorage.setItem('wb_cart', JSON.stringify(this.cart));
                this.updateBadges();
                this.showToast(`${title} ${dict[this.lang].toast_add}`, 'success');
            }

            showToast(message, type = 'default') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `toast-msg ${type}`;
                const icon = '<svg width="20" height="20" fill="none" stroke="#10b981" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
                toast.innerHTML = `${icon} <span>${message}</span>`;
                container.appendChild(toast);

                void toast.offsetWidth; // Trigger reflow
                toast.classList.add('show');

                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }
        }

        // Initialize App
        const menuApp = new MenuApp();

    </script>
</body>
